<form id="add-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">Slug:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-slug" data-rule="required" class="form-control" name="row[slug]" type="text" placeholder="如 yuyao / shanghai-center">
            <span class="help-block">前台详情地址：/stores/{slug}</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">店名(中):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title" data-rule="required" class="form-control" name="row[title]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">店名(英):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title_en" class="form-control" name="row[title_en]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">店名(日):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-title_jp" class="form-control" name="row[title_jp]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">一句话(中):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-tagline" class="form-control" name="row[tagline]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">一句话(英):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-tagline_en" class="form-control" name="row[tagline_en]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">一句话(日):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-tagline_jp" class="form-control" name="row[tagline_jp]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">介绍(中):</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-intro" class="form-control" rows="4" name="row[intro]"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">介绍(英):</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-intro_en" class="form-control" rows="3" name="row[intro_en]"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">介绍(日):</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-intro_jp" class="form-control" rows="3" name="row[intro_jp]"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">到店指引(中):</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-directions" class="form-control" rows="3" name="row[directions]"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">到店指引(英):</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-directions_en" class="form-control" rows="2" name="row[directions_en]"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">到店指引(日):</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-directions_jp" class="form-control" rows="2" name="row[directions_jp]"></textarea>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">地址(中):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address" data-rule="required" class="form-control" name="row[address]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">地址(英):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address_en" class="form-control" name="row[address_en]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">地址(日):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-address_jp" class="form-control" name="row[address_jp]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">电话:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-phone" data-rule="required" class="form-control" name="row[phone]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">营业时间:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-hours" class="form-control" name="row[hours]" type="text" value="9:30–23:00" placeholder="9:30–23:00">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">交通(中):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-metro" class="form-control" name="row[metro]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">交通(英):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-metro_en" class="form-control" name="row[metro_en]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">交通(日):</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-metro_jp" class="form-control" name="row[metro_jp]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">服务slug:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-services" class="form-control" name="row[services]" type="text" value="moxibustion,tuina,spa,foot,traditional">
            <span class="help-block">逗号分隔：moxibustion,tuina,spa,foot,traditional</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">设施key:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-facilities" class="form-control" name="row[facilities]" type="text" value="privateRoom,tea,hygienic">
            <span class="help-block">逗号分隔，对应前台 stores.facilities.* 文案键</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">封面(中):</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image" data-rule="required" class="form-control" size="50" name="row[image]" type="text" value="">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="plupload-image" class="btn btn-danger plupload" data-input-id="c-image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp" data-multiple="false" data-preview-id="p-image"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-image" class="btn btn-primary fachoose" data-input-id="c-image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
            </div>
            <ul class="row list-inline plupload-preview" id="p-image"></ul>
            <span class="help-block">也可填前端静态文件名，如 store-banner.png</span>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">封面(日):</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image_jp" class="form-control" size="50" name="row[image_jp]" type="text" value="">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="plupload-image_jp" class="btn btn-danger plupload" data-input-id="c-image_jp" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp" data-multiple="false" data-preview-id="p-image_jp"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-image_jp" class="btn btn-primary fachoose" data-input-id="c-image_jp" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
            </div>
            <ul class="row list-inline plupload-preview" id="p-image_jp"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">封面(英):</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image_en" class="form-control" size="50" name="row[image_en]" type="text" value="">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="plupload-image_en" class="btn btn-danger plupload" data-input-id="c-image_en" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp" data-multiple="false" data-preview-id="p-image_en"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-image_en" class="btn btn-primary fachoose" data-input-id="c-image_en" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
            </div>
            <ul class="row list-inline plupload-preview" id="p-image_en"></ul>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">状态:</label>
        <div class="col-xs-12 col-sm-8">
            <select id="c-status" class="form-control" name="row[status]">
                <option value="1" selected>显示</option>
                <option value="0">隐藏</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('排序')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-listorder" class="form-control" name="row[weigh]" type="number" value="0">
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
