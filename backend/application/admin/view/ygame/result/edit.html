<form id="edit-form" class="form-horizontal" role="form" data-toggle="validator" method="POST" action="">
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('学生照片')}:</label>
        <div class="col-xs-12 col-sm-8">
            <div class="input-group">
                <input id="c-image" data-rule="required" class="form-control" size="50" name="row[picture]" type="text" value="{$row.picture|htmlentities}">
                <div class="input-group-addon no-border no-padding">
                    <span><button type="button" id="plupload-image" class="btn btn-danger plupload" data-input-id="c-image" data-mimetype="image/gif,image/jpeg,image/png,image/jpg,image/bmp" data-multiple="false" data-preview-id="p-image"><i class="fa fa-upload"></i> {:__('Upload')}</button></span>
                    <span><button type="button" id="fachoose-image" class="btn btn-primary fachoose" data-input-id="c-image" data-mimetype="image/*" data-multiple="false"><i class="fa fa-list"></i> {:__('Choose')}</button></span>
                </div>
                <span class="msg-box n-right" for="c-image"></span>
            </div>
            <ul class="row list-inline plupload-preview" id="p-image"></ul>
        </div>
    </div>

    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('省市')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-province" data-rule="required" value="{$row.province|htmlentities}" data-level="city"  data-toggle="city-picker" class="form-control" name="row[province]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('姓名')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-name" value="{$row.name|htmlentities}" data-rule="required" class="form-control" name="row[name]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('编号')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-number" value="{$row.number|htmlentities}" data-rule="required" class="form-control" name="row[number]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('年龄')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-age" value="{$row.age|htmlentities}"  class="form-control" name="row[age]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('报名机构')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-register-institution" value="{$row.register_institution|htmlentities}" class="form-control" name="row[register_institution]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('指导老师')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-teacher" value="{$row.teacher|htmlentities}"  class="form-control" name="row[teacher]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('作品类型')}:</label>
        <div class="col-xs-12 col-sm-8">
            {$typeList}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('作品名称')}:</label>
        <div class="col-xs-12 col-sm-8">
            <input id="c-work_name" value="{$row.work_name|htmlentities}" data-rule="required" class="form-control" name="row[work_name]" type="text">
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('参与荣誉')}:</label>
        <div class="col-xs-12 col-sm-8">
            {$certList}
        </div>
    </div>
    <div class="form-group">
        <label class="control-label col-xs-12 col-sm-2">{:__('作品')}:</label>
        <div class="col-xs-12 col-sm-8">
            <textarea id="c-work" data-rule="required" class="form-control editor" rows="5" name="row[work]" cols="50">{$row.work|htmlentities}</textarea>
        </div>
    </div>
    <div class="form-group layer-footer">
        <label class="control-label col-xs-12 col-sm-2"></label>
        <div class="col-xs-12 col-sm-8">
            <button type="submit" class="btn btn-success btn-embossed disabled">{:__('OK')}</button>
            <button type="reset" class="btn btn-default btn-embossed">{:__('Reset')}</button>
        </div>
    </div>
</form>
