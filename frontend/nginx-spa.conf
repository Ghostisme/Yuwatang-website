# 前端根目录部署：替换站点原有 location /，并加入命名 location。
# /h5/ 等子目录部署请使用对应构建生成的 dist/nginx-spa.conf。
# 保留站点已有的 PHP/API 配置，不要叠加重复的 location /。

# 旧页面保留 301，原有查询参数（包括 lang）自动保留。
rewrite ^/(about-us|about_us)/?$ /about permanent;
rewrite ^/(contact-us|contact_us)/?$ /contact permanent;
rewrite ^/feature/?$ /services permanent;
rewrite ^/(store|shop)/?$ /stores permanent;
rewrite ^/home/?$ / permanent;
rewrite ^/serve/?$ /services/traditional permanent;

location / {
    try_files $uri $uri/ @yuwatang_pages;
}

location @yuwatang_pages {
    # 只将有效的前端路由格式交给 SPA，缺失图片、文本及无效路径返回真实 404。
    # 新闻 ID、门店 slug 对应记录是否存在，由详情页和后台接口判断。
    if ($uri ~ "^/(?:about|services|base|stores|faq|news|reviews|contact|guide|trace|device-redirect|services/(?:moxibustion|tuina|spa|foot|traditional|cupping|gua-sha|ear-care|pedicure|pediatric-tuina)|stores/[a-z0-9-]+|news/[0-9]+)/?$") {
        rewrite ^ /index.html last;
    }
    return 404;
}
